---
# ---------------------------------------------------------------------------
# Pixel AVD identity and local install paths
# ---------------------------------------------------------------------------

pixel_avd_name: "Pixel_9a"
pixel_avd_display_name: "Pixel 9a"

# ---------------------------------------------------------------------------
# Offline/cache install input
# ---------------------------------------------------------------------------
#
# Pixel_9a.avd.tgz is an optional offline/cache input for the Pixel component.
# It should contain:
#
#   Pixel_9a.avd/
#     config.ini
#     ...
#
# and is extracted into {{ mc_dir }}.
#
# Pixel_9a.ini is intentionally written by tasks.yml rather than trusted from
# the archive. This keeps the source artifact relocatable and ensures the ini
# uses the FIREWHEEL runtime path template:
#
#   path=REPLACE_WITH_FULL_PATH/.android/avd/Pixel_9a.avd
#   path.rel=avd/Pixel_9a.avd
pixel_avd_archive_filename: "{{ pixel_avd_name }}.avd.tgz"
pixel_avd_archive: "{{ mc_dir }}/{{ pixel_avd_archive_filename }}"
pixel_prefer_archive_if_present: true

install_inputs:
  - destination: "{{ pixel_avd_archive }}"
    source: "{{ mc_name }}/{{ pixel_avd_archive_filename }}"

# Install source AVD artifacts directly into this model component directory.
#
# Source/install layout:
#
#   {{ mc_dir }}/Pixel_9a.ini
#   {{ mc_dir }}/Pixel_9a.avd/config.ini
#
# At experiment/runtime staging, FIREWHEEL/AndroidPhone.set_avd() expects the
# active AVD layout to be:
#
#   <runtime_dir>/.android/avd/Pixel_9a.ini
#   <runtime_dir>/.android/avd/Pixel_9a.avd/config.ini
#
# Therefore Pixel_9a.ini is written as a relocatable template using
# REPLACE_WITH_FULL_PATH. The model component replaces that placeholder with the
# actual runtime directory.
pixel_avd_template_base: "REPLACE_WITH_FULL_PATH"
pixel_avd_home: "{{ mc_dir }}"
pixel_avd_dir: "{{ mc_dir }}/{{ pixel_avd_name }}.avd"
pixel_avd_ini: "{{ mc_dir }}/{{ pixel_avd_name }}.ini"


# ---------------------------------------------------------------------------
# android_base discovery
# ---------------------------------------------------------------------------

# Model component name to find with:
#
#   firewheel mc list -p -m -k name=android.base_objects
android_base_mc_name: "android.base_objects"

# Optional explicit override.
#
# If auto-detection using "firewheel mc list" fails, set this to the full
# android_base model component directory, for example:
#
#   /opt/firewheel/model_components/android/src/firewheel_repo_android/android_base
android_base_dir_override: ""

# Optional explicit SDK root override.
#
# If set, this takes precedence over android_base auto-detection.
android_sdk_root_override: ""

# ---------------------------------------------------------------------------
# Android SDK package requirements for this Pixel AVD
# ---------------------------------------------------------------------------

pixel_android_api_level: "36"
pixel_system_image_flavor: "google_apis"
pixel_system_image_arch: "x86_64"

pixel_platform_package: "platforms;android-{{ pixel_android_api_level }}"
pixel_system_image_package: "system-images;android-{{ pixel_android_api_level }};{{ pixel_system_image_flavor }};{{ pixel_system_image_arch }}"

# These are evaluated after android_sdk_root_effective is discovered in tasks.yml.
pixel_sdk_packages:
  - name: "{{ pixel_platform_package }}"
    creates: "{{ android_sdk_root_effective }}/platforms/android-{{ pixel_android_api_level }}/android.jar"

  - name: "{{ pixel_system_image_package }}"
    creates: "{{ android_sdk_root_effective }}/system-images/android-{{ pixel_android_api_level }}/{{ pixel_system_image_flavor }}/{{ pixel_system_image_arch }}/source.properties"

# ---------------------------------------------------------------------------
# Pixel-like runtime configuration
# ---------------------------------------------------------------------------

# The Pixel 9a named skin is not available through sdkmanager in the tested
# environment. FIREWHEEL does not need the visual device frame, so make the AVD
# resolution-based and remove skin.path.
pixel_disable_named_skin: true
pixel_fallback_skin_name: "1080x2424"

# Create sdcard.img if missing. This is not strictly required in all emulator
# versions, but it makes the generated AVD more complete and closer to a normal
# Android Studio-created AVD.
pixel_create_sdcard_img: true
pixel_sdcard_size: "512M"
pixel_sdcard_img: "{{ pixel_avd_dir }}/sdcard.img"

# Required/desired persistent config.ini values.
#
# This intentionally does not try to recreate hardware-qemu.ini. That file is
# derived runtime state and should be regenerated by the emulator.
pixel_avd_required_config_values:
  - key: "AvdId"
    value: "{{ pixel_avd_name }}"

  - key: "avd.id"
    value: "{{ pixel_avd_name }}"

  - key: "avd.name"
    value: "{{ pixel_avd_name }}"

  - key: "PlayStore.enabled"
    value: "false"

  - key: "abi.type"
    value: "{{ pixel_system_image_arch }}"

  - key: "avd.ini.displayname"
    value: "{{ pixel_avd_display_name }}"

  - key: "avd.ini.encoding"
    value: "UTF-8"

  - key: "disk.dataPartition.size"
    value: "50G"

  - key: "fastboot.forceChosenSnapshotBoot"
    value: "no"

  - key: "fastboot.forceColdBoot"
    value: "no"

  - key: "fastboot.forceFastBoot"
    value: "yes"

  - key: "hw.cpu.arch"
    value: "{{ pixel_system_image_arch }}"

  - key: "hw.cpu.ncore"
    value: "4"

  - key: "hw.device.manufacturer"
    value: "Google"

  - key: "hw.device.name"
    value: "pixel_9a"

  - key: "hw.gpu.enabled"
    value: "yes"

  - key: "hw.gpu.mode"
    value: "swiftshader_indirect"

  - key: "hw.initialOrientation"
    value: "portrait"

  - key: "hw.keyboard"
    value: "yes"

  - key: "hw.lcd.density"
    value: "420"

  - key: "hw.lcd.height"
    value: "2424"

  - key: "hw.lcd.width"
    value: "1080"

  - key: "hw.ramSize"
    value: "2048"

  - key: "hw.sdCard"
    value: "yes"

  - key: "image.sysdir.1"
    value: "system-images/android-{{ pixel_android_api_level }}/{{ pixel_system_image_flavor }}/{{ pixel_system_image_arch }}/"

  - key: "runtime.network.latency"
    value: "none"

  - key: "runtime.network.speed"
    value: "full"

  - key: "sdcard.size"
    value: "{{ pixel_sdcard_size }}"

  - key: "showDeviceFrame"
    value: "no"

  - key: "skin.dynamic"
    value: "yes"

  - key: "skin.name"
    value: "{{ pixel_fallback_skin_name }}"

  - key: "tag.display"
    value: "Google APIs"

  - key: "tag.displaynames"
    value: "Google APIs"

  - key: "tag.id"
    value: "{{ pixel_system_image_flavor }}"

  - key: "tag.ids"
    value: "{{ pixel_system_image_flavor }}"

  - key: "target"
    value: "android-{{ pixel_android_api_level }}"

  - key: "userdata.useQcow2"
    value: "true"

  - key: "vm.heapSize"
    value: "512"

# FIREWHEEL install completion markers.
required_files:
  - destination: "{{ pixel_avd_ini }}"
  - destination: "{{ pixel_avd_dir }}/config.ini"
